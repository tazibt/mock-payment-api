spring.application.name=mock-payment-sap

mock.port=8085
mock.delay.success=0
mock.delay.timeout=10000
mock.delay.error=2000
mock.force.status=NONE
mock.force.errorCode=CARD_EXPIRED

spring.config.import=optional:file:./config/mock-config.properties
server.port=${mock.port}

# pour que les sleep ne bloquent pas les threads tomcat en charge
spring.threads.virtual.enabled=true
