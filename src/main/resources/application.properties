spring.application.name=mock-payment-sap

# Valeurs par défaut, surchargeables par config/mock-config.properties
mock.port=8085
mock.delay.success=0
mock.delay.timeout=10000
mock.delay.error=2000
mock.force.status=NONE
mock.force.errorCode=CARD_EXPIRED

spring.config.import=optional:file:./config/mock-config.properties
server.port=${mock.port}

# Threads virtuels (Java 21) : les délais simulés ne bloquent pas les threads Tomcat,
# le mock tient la charge sans devenir le goulot d'un test de performance
spring.threads.virtual.enabled=true
