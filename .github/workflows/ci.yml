name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Smoke tests (@smoke)
        run: ./mvnw -B test -Dtest=RunCucumberTest "-Dcucumber.filter.tags=@smoke"

  acceptance:
    name: Tests d'acceptation (ATDD)
    needs: smoke   # la campagne complète ne tourne que si les smoke tests passent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tous les scénarios
        run: ./mvnw -B test
      - name: Rapport Cucumber
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-report.html
